<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-root">
      <header class="header">
        <div class="brand">
          <div class="logo-chip">f</div>
          <div class="brand-text">
            <p class="brand-name">Fontscope</p>
            <p class="brand-version">v1.4.2</p>
          </div>
        </div>
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-label">Ready</span>
        </div>
      </header>

      <main class="main-body">
        <div class="intro">
          <p class="intro-title">Identify web typography instantly</p>
          <p class="intro-body">
            Activate the inspecting eye to scope out families, sizes, weights, and complete CSS stylesheets of any element.
          </p>
        </div>

        <button class="activate-btn" id="activate-btn">
          <span class="icon icon-target" aria-hidden="true"></span>
          <span>Start Inspecting</span>
        </button>

        <div class="recent-section">
          <div class="recent-header">
            <p class="recent-label">Recent Inspections</p>
            <button class="clear-link" id="clear-link">Clear</button>
          </div>
          <div class="recent-list" id="recent-list">
            <p class="recent-empty" id="recent-empty">No inspections yet — click Start Inspecting on any page.</p>
          </div>
        </div>
      </main>

      <div class="spacer"></div>

      <footer class="footer">
        <p class="shortcut-hint">Press <span class="mono-key">⌥ I</span> to trigger picker</p>
        <div class="footer-icons">
          <span class="icon icon-circle_help footer-icon" title="Help"></span>
          <button class="icon-btn footer-icon" id="theme-toggle" title="Toggle light/dark theme">
            <span class="icon icon-moon"></span>
          </button>
          <button class="icon-btn footer-icon" id="dashboard-btn" title="Saved Fonts">
            <span class="icon icon-bookmark"></span>
          </button>
        </div>
      </footer>
    </div>

    <script src="lib/icons.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
